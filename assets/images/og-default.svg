<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e1a"/>
      <stop offset="100%" stop-color="#12131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d31f5"/>
      <stop offset="100%" stop-color="#21a3b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d31f5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4d31f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="60" height="60" rx="14" fill="url(#accent)"/>
  <text x="110" y="125" font-family="Arial" font-size="40" font-weight="800" fill="white" text-anchor="middle">Q</text>
  <!-- Wordmark -->
  <text x="160" y="127" font-family="Arial" font-size="30" font-weight="700" fill="white" letter-spacing="-0.5">Qapitol AI</text>
  <!-- Headline -->
  <text x="80" y="300" font-family="Arial" font-size="62" font-weight="800" fill="white" letter-spacing="-2">AI Quality &amp; Governance</text>
  <text x="80" y="375" font-family="Arial" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="-2">Built for Enterprise</text>
  <!-- Tagline -->
  <text x="80" y="450" font-family="Arial" font-size="26" fill="#8888aa">SURE-Q Framework · QAVE · Nexus · Agent Fabric · Qurator</text>
  <!-- URL -->
  <text x="80" y="560" font-family="Arial" font-size="22" fill="#555577">qapitol.com</text>
</svg>
